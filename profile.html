<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveler Profile</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css">
</head>

<body>

<header>
    <h1>🌍 Wanderlog</h1>
    <button id="themeToggle">🌙 Dark Mode</button>
</header>

<section class="profile">

    <h2>👤 Traveler Profile</h2>

    <h3>Kirti Dhama</h3>

    <button onclick="copyProfileLink()">🔗 Copy Profile Link</button>

    <p>
        Passionate traveler and web developer who loves exploring new places and documenting journeys.
    </p>

</section>

<section class="profile-stats"
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    gap: 40px;
    width: 90%;
    margin: 30px auto;
    padding: 20px;
">

    <div class="stat-card"
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        width: auto;
    ">
        <h3 style="margin: 0;">🧳 Total Trips</h3>
        <p id="profileTotalTrips" style="margin: 0; font-weight:900;">0</p>
    </div>

    <div class="stat-card"
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        width: auto;
    ">
        <h3 style="margin: 0;">⭐ Favorite Trips</h3>
        <p id="profileFavoriteTrips" style="margin: 0; font-weight:900;">0</p>
    </div>

    <div class="stat-card"
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        width: auto;
    ">
        <h3 style="margin: 0;">📍 Destinations</h3>
        <p id="profileDestinations" style="margin: 0; font-weight:900;">0</p>
    </div>

</section>

<section class="profile-trips-section">

    <h2>My Trips</h2>

    <div id="profileTrips"></div>
    
    <h3 id="userName"></h3>

</section>

<script src="profile.js"></script>


</body>

</html>
